<!doctype html>
<html lang="en" data-theme="dark" class="dark">
  <head>
    <meta charset="UTF-8" />
    <title>Into the Unknown</title>
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="description" content="" />
    <link href="./dist/output.css" rel="stylesheet" />
  </head>

  <body class="bg-zinc-950 text-white m-0 page-enter">
    <main class="relative m-0">
      <section
        class="relative h-screen grid place-items-center"
        style="animation: fadein 1s ease-out 0.3s both"
      >

        <blockquote
          class="absolute bottom-40 left-1/2 -translate-x-1/2 max-w-xs text-left border-l-2 border-zinc-600 pl-4 italic text-zinc-400 text-xl"
        >
          <p>
            "We are all in the gutter, but some of us are looking at the stars."
          </p>
          <footer class="mt-2 text-xs text-zinc-500 not-italic">
            — Oscar Wilde
          </footer>
        </blockquote>
        <!--
        <h3 class="text-lg md:text-xl font-medium text-zinc-500">
          Exploring the infinite mysteries of stars, galaxies, and the unknown.
        </h3>
-->
        <div
          class="absolute bottom-10 left-1/2 -translate-x-1/2 flex flex-col items-center gap-2 text-white/60"
        >
          <span class="text-xs font-medium tracking-widest uppercase"
            >Scroll Down</span
          >
          <svg
            class="w-6 h-6 animate-bounce"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M19 9l-7 7-7-7"
            ></path>
          </svg>
        </div>
      </section>
      <section
        class="relative h-screen grid place-items-center overflow-hidden void-blend"
      >
        <div class="background-overlay"></div>
        <img
          src="./img/other.jpg"
          class="background-container"
          alt="mazin-pookie"
        />
      </section>
      <section class="h-screen void-blend"></section>
    </main>
  </body>
  <script src="./src/scripts/check-img.js"></script>
  <script src="./src/scripts/spawn-sparkle.js"></script>
</html>
